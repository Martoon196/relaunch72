<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relaunch72 — Checkout</title>
<meta name="robots" content="noindex" />
<style>
  :root{
    --ink:#0c1018;--paper:#f6f7fb;--card:#fff;--muted:#586173;--faint:#8b93a3;--hair:#e4e7ee;
    --electric:#3557ff;--electric-ink:#2a44d6;--wash:#eef1ff;--green:#17915a;--amber:#b1741a;
    --shadow:0 1px 2px rgba(12,16,24,.05),0 14px 40px -22px rgba(12,16,24,.28);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{--ink:#e9edf6;--paper:#090b0f;--card:#12161d;--muted:#98a2b4;--faint:#6b7484;--hair:#222a35;--electric:#6d86ff;--electric-ink:#93a6ff;--wash:#141b2a;--green:#45c088;--amber:#d8a04e;--shadow:0 1px 2px rgba(0,0,0,.4),0 16px 44px -24px rgba(0,0,0,.8)}}
  :root[data-theme="light"]{--ink:#0c1018;--paper:#f6f7fb;--card:#fff;--muted:#586173;--faint:#8b93a3;--hair:#e4e7ee;--electric:#3557ff;--electric-ink:#2a44d6;--wash:#eef1ff}
  :root[data-theme="dark"]{--ink:#e9edf6;--paper:#090b0f;--card:#12161d;--muted:#98a2b4;--faint:#6b7484;--hair:#222a35;--electric:#6d86ff;--electric-ink:#93a6ff;--wash:#141b2a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 22px 90px}
  a{color:inherit}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px}
  .mark{font-weight:800;font-size:19px;letter-spacing:-.02em;text-decoration:none}
  .mark b{color:var(--electric)}
  .back{font-family:var(--mono);font-size:12.5px;color:var(--faint);text-decoration:none}
  .back:hover{color:var(--ink)}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:26px 0 0}
  .sub{color:var(--muted);font-size:15px;margin-top:8px}
  .order{margin-top:24px;background:var(--card);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .order .head{padding:20px 22px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .order .head .name{font-weight:750;font-size:18px}
  .order .head .price{font-family:var(--mono);font-weight:700;font-size:20px;white-space:nowrap}
  .order .body{padding:18px 22px}
  .order .body ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}
  .order .body li{margin:5px 0}
  .bump{margin:16px 22px;border:1px solid var(--hair);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .bump input{margin-top:3px;width:18px;height:18px;accent-color:var(--electric);flex-shrink:0}
  .bump .t{font-size:14px}.bump .t b{color:var(--ink)}
  .bump .t .p{font-family:var(--mono);color:var(--electric-ink);font-weight:600}
  .total{padding:18px 22px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;align-items:baseline;font-weight:750}
  .total .amt{font-family:var(--mono);font-size:24px;font-weight:800}
  .pay{width:100%;margin-top:20px;font:inherit;font-weight:700;font-size:17px;border:none;border-radius:12px;padding:17px;background:var(--electric);color:#fff;cursor:pointer;transition:filter .12s}
  .pay:hover{filter:brightness(1.07)}
  .trust{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--faint)}
  .trust b{color:var(--muted)}
  .notlive{margin-top:18px;border:1px dashed var(--amber);border-radius:12px;padding:16px;font-size:13.5px;color:var(--muted);background:color-mix(in srgb,var(--amber) 7%,transparent)}
  .notlive b{color:var(--ink)}
  .devlink{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:13px;color:var(--electric-ink);text-decoration:none;font-weight:600}
  .devlink:hover{text-decoration:underline}
  .stripe-note{margin-top:14px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="mark" href="index.html">Relaunch<b>72</b></a>
    <a class="back" href="index.html">← back</a>
  </div>

  <h1 id="h1">Confirm your relaunch</h1>
  <p class="sub">Pay once. Then the 45-minute intake — and your 72-hour clock starts the moment we accept it.</p>

  <div class="order">
    <div class="head"><span class="name" id="o-name">—</span><span class="price" id="o-price">—</span></div>
    <div class="body"><ul id="o-incl"></ul></div>
    <label class="bump" id="bump-row" style="display:none">
      <input type="checkbox" id="bump" />
      <span class="t"><b>Add the 90-day content engine</b> <span class="p">+$147</span><br />60 more days of social and 12 more emails, so month two doesn't go quiet.</span>
    </label>
    <div class="total"><span>Total today</span><span class="amt" id="o-total">—</span></div>
  </div>

  <button class="pay" id="pay">Continue to secure payment →</button>
  <div class="trust">
    <span><b>72-hour</b> ship guarantee</span>
    <span><b>Human</b> sign-off</span>
    <span><b>One</b> revision included</span>
  </div>
  <div id="notlive"></div>
  <div class="stripe-note">Payments are processed securely by Stripe. Test mode until launch.</div>
</div>

<script src="checkout-config.js"></script>
<script>
(function(){
  var TIERS = {
    autopsy: { name:'Marketing Autopsy', price:97, bump:false,
      incl:['The marketing audit & scorecard — where you’re leaking customers','Every dollar credits against Core within 14 days'] },
    core: { name:'Relaunch72 Core', price:997, bump:true,
      incl:['All nine deliverables, delivered in 72 hours','Human strategist sign-off on every line','One full revision round included'] },
    pro: { name:'Relaunch72 Pro', price:2497, bump:false,
      incl:['Everything in Core','90-minute strategy session','Hero assets rewritten by hand','Implementation roadmap + 30 days of support'] },
  };
  function qp(k){ return new URLSearchParams(location.search).get(k); }
  var tier = (qp('tier')||'core').toLowerCase();
  if(!TIERS[tier]) tier='core';
  var t = TIERS[tier];
  var cfg = window.RELAUNCH72_CHECKOUT || { paymentLinks:{}, successPath:'intake/' };
  function money(n){ return '$'+n.toLocaleString('en-US'); }

  document.getElementById('h1').textContent = tier==='autopsy' ? 'Get your marketing autopsy' : 'Confirm your relaunch';
  document.getElementById('o-name').textContent = t.name;
  document.getElementById('o-price').textContent = tier==='core' ? '$997' : money(t.price);
  document.getElementById('o-incl').innerHTML = t.incl.map(function(x){return '<li>'+x+'</li>';}).join('');
  if(t.bump) document.getElementById('bump-row').style.display='';

  function withBump(){ return t.bump && document.getElementById('bump').checked; }
  function total(){ return t.price + (withBump()?147:0); }
  function render(){ document.getElementById('o-total').textContent = money(total()); }
  var bump=document.getElementById('bump'); if(bump) bump.addEventListener('change',render);
  render();

  function showNotLive(extra){
    var params = 'tier='+tier + (withBump()?'&bump=1':'') + '&dev=1';
    document.getElementById('notlive').innerHTML =
      '<div class="notlive"><b>Card payment isn’t live yet.</b> '+(extra?extra+' ':'')+
      'Set <code>apiBase</code> (the payments server) or Stripe test-mode payment links in <code>checkout-config.js</code> — no code change. '+
      'For now you can walk the rest of the flow: '+
      '<a class="devlink" href="'+(cfg.successPath||'intake/')+'?'+params+'">Continue to the intake (dev preview) →</a></div>';
    document.getElementById('notlive').scrollIntoView({behavior:'smooth',block:'center'});
  }
  document.getElementById('pay').addEventListener('click', function(){
    var btn = document.getElementById('pay');
    // Option A — backend Checkout Session (auto-starts the build after payment).
    if(cfg.apiBase){
      btn.textContent='One sec…'; btn.disabled=true;
      fetch(cfg.apiBase.replace(/\/$/,'')+'/api/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tier:tier,bump:withBump()})})
        .then(function(r){return r.json();})
        .then(function(d){ if(d&&d.url){ window.location.href=d.url; } else { btn.textContent='Continue to secure payment →'; btn.disabled=false; showNotLive(d&&d.error?('Server: '+d.error+'.'):''); } })
        .catch(function(){ btn.textContent='Continue to secure payment →'; btn.disabled=false; showNotLive('Couldn’t reach the payments server.'); });
      return;
    }
    // Option B — Stripe Payment Link.
    var key = (tier==='core' && withBump()) ? 'core_bump' : tier;
    var link = (cfg.paymentLinks||{})[key];
    if(link){ window.location.href = link; return; }
    // Nothing wired — honest state + dev walk-through.
    showNotLive('');
  });
})();
</script>
</body>
</html>
