# Relaunch72 payments API — Render Blueprint.
# In Render: New + → Blueprint → connect this repo → pick branch
# `codex/relaunch72-platform-foundation`. Render reads this file and creates the
# service; you then paste the secret env vars (marked sync:false) in the dashboard.
#
# It's an npm workspaces monorepo, so we build from the repo root (the lockfile
# lives here) and start the orchestrator workspace's `serve` script.
#
# TEST SANDBOX ONLY: test keys exercise the flow. Live/unknown Stripe keys enter
# LIVE LOCKED mode; swapping a key never enables real-money checkout.
services:
  - type: web
    name: relaunch72-payments
    runtime: node
    region: frankfurt          # closest to the UK; change if you prefer
    plan: free                 # ephemeral test sandbox only; never a real-order host.
    branch: codex/relaunch72-platform-foundation
    buildCommand: npm ci
    startCommand: npm run serve
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Recurring platform plans are visible only as a preview; no checkout form.
      - key: PLATFORM_SUBSCRIPTIONS_ENABLED
        value: "false"
      - key: PUBLIC_LEAD_CAPTURE_ENABLED
        value: "false"
      - key: RELAUNCH72_FORCE_MOCK_BUILDS
        value: "true"
      - key: RELAUNCH72_MAX_CONCURRENT_BUILDS
        value: "2"
      # The SITE origin Stripe returns to after payment (not this API's URL).
      - key: PUBLIC_BASE_URL
        value: https://relaunch72.com
      # ---- secrets: paste these in the Render dashboard (never in git) ----
      - key: STRIPE_SECRET_KEY        # sk_test_… only; live keys are intentionally locked
        sync: false
      - key: STRIPE_WEBHOOK_SECRET    # whsec_… from the Stripe webhook you register (add after 1st deploy)
        sync: false
      - key: SESSION_SECRET           # dedicated random 32+ character cookie-signing key (required)
        sync: false
      - key: SANDBOX_ACCESS_TOKEN     # private 24+ char founder code for the public test sandbox
        sync: false
      # ---- optional ----
      # Do not add Brevo/Postmark credentials here. Customer outbound messaging
      # and automatic portal setup are intentionally locked in the test sandbox.
      # In test mode, all four prices can auto-create when every value is blank.
      # If pinning manually, set ALL four; a partial catalog is fail-closed:
      # - key: STRIPE_PRICE_AUTOPSY
      #   sync: false
      # - key: STRIPE_PRICE_CORE
      #   sync: false
      # - key: STRIPE_PRICE_CORE_BUMP
      #   sync: false
      # - key: STRIPE_PRICE_PRO
      #   sync: false
      # - key: ALLOWED_ORIGINS        # extra browser origins, comma-separated.
      #   sync: false                 #   relaunch72.com + martoon196.github.io are built in.
      # - key: DATA_DIR               # set to /var/data ONLY if you add a disk below.
      #   value: /var/data

# NOTES
# • Free plan sleeps when idle and a detached build can be interrupted. A paid
#   instance/disk may improve testing, but does not make this production-safe:
#
#   disk:
#     name: r72-data
#     mountPath: /var/data
#     sizeGB: 1
#
# • Orders/intakes reset on redeploy without a disk. Even with a disk, file journals
#   are not the PostgreSQL transactional foundation required for live money.
