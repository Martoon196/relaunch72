name: Deploy site to GitHub Pages

# Publishes the static funnel (site/: landing → checkout → intake) to GitHub Pages.
# configure-pages enablement:true turns Pages on via the workflow token, so no
# manual settings toggle is needed. The payments backend is NOT deployed here
# (it needs a Node host); on Pages the checkout shows its "not live yet" state
# and walks through to the intake.

on:
  push:
    branches: [claude/relaunch72-architecture-1fi7qd]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages (enables it if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the site/ folder as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
