name: Native webinars exact-source integration gate
on:
  push:
    branches: [codex/native-webinars-limits146-20261109]
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Required local media runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -hide_banner -version
      - name: Install pinned renderer for actual artwork and video checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: npx --no-install playwright-core install --with-deps --only-shell chromium
      - name: Permit the exact pinned CI browser to create its sandbox
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: |
          # Ubuntu's AppArmor restriction blocked Chromium's namespace sandbox.
          # Use Chromium's documented per-binary profile, not a global switch
          # or an application --no-sandbox override. Disposable runner only.
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          webinar_ci_chromium="$(node --import tsx --input-type=module -e "import {findCreativeChromium} from './orchestrator/src/creative-studio/renderer.ts'; console.log(findCreativeChromium() ?? '')")"
          test -x "$webinar_ci_chromium"
          sudo tee /etc/apparmor.d/rl72-ci-chromium >/dev/null <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile rl72-ci-chromium "$webinar_ci_chromium" flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/rl72-ci-chromium
      - name: Verify the renderer starts with the application sandbox policy
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: |
          node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';
          import { findCreativeChromium } from './orchestrator/src/creative-studio/renderer.ts';
          const executablePath = findCreativeChromium();
          assert(executablePath, 'Pinned Chromium was not found');
          const browser = await chromium.launch({ executablePath, headless: true,
            chromiumSandbox: process.getuid?.() !== 0,
            args: ['--disable-gpu', '--font-render-hinting=none', '--disable-lcd-text'] });
          await browser.close();
          console.log('Actual application Chromium launch policy passed.');
          NODE
      - name: TypeScript and supply-chain gates
        run: |
          npm run typecheck
          node scripts/supply-chain.mjs --check
      - name: Apply all exact migrations to disposable localhost only
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/rl72-boosters-pg-bootstrap.mjs
      - name: Actual-role native webinars and failure recovery
        working-directory: orchestrator
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          TEST_DATABASE_RESET_CONFIRM: reset-disposable-branch
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx --test --test-concurrency=1 test/db/native-webinars.integration.test.ts test/db/native-webinars-http.integration.test.ts test/db/native-webinars-recovery.integration.test.ts test/db/native-webinars-browser.integration.test.ts test/db/mhp-wa-direct-inbox.integration.test.ts
      - name: Existing Creative Studio actual-role neighbours
        working-directory: orchestrator
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const url = new URL(process.env.RL72_METHODS_PG_TEST_URL);
          assert(['localhost', '127.0.0.1'].includes(url.hostname));
          assert.equal(url.pathname, '/relaunch72_test');
          assert.equal(process.env.RELAUNCH72_DATABASE_INTEGRATION, 'explicit-disposable-run');
          const admin = new pg.Pool({ connectionString: url.toString(), max: 1 });
          try {
            // Webinar fixtures rotate this role's password; restore the neighbour fixture's local-only password.
            await admin.query("ALTER ROLE r72_content_command PASSWORD 'local-methods-test-only'");
          } finally { await admin.end(); }
          NODE
          node --import tsx --test --test-concurrency=1 test/db/creative-studio-pg.integration.test.ts test/db/creative-studio-video-pg.integration.test.ts test/db/acquisition-campaign-pg.integration.test.ts test/db/creative-studio-distribution-pg.integration.test.ts test/db/creative-studio-learning-pg.integration.test.ts test/db/creative-studio-generation-pg.integration.test.ts test/db/creative-studio-enquiry-pg.integration.test.ts
      - name: Fetch exact prepared limits0145 recovery source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2c99f7b36042a5bfb8879b967310ac9f2897d8a2
          path: recovery-source
          persist-credentials: false
      - name: Prove recovery against actual exact native0146 ledger
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/native-webinars-recovery-proof.mjs
      - name: Exact-source offline suite with real local media tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
          TEST_DATABASE_URL: ''
          RL72_METHODS_PG_TEST_URL: ''
          RELAUNCH72_DATABASE_INTEGRATION: ''
        run: npm test
