name: Operator API exact-source gate
on:
  push:
    branches: [claude/gifted-lamport-i4bdio]
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript and supply-chain gates
        run: |
          npm run typecheck
          node scripts/supply-chain.mjs --check
      - name: Operator, follow-up tools, ledger contracts and preserved sign-in neighbours
        run: node --import tsx --test orchestrator/test/operator.test.ts orchestrator/test/operator-followups.test.ts orchestrator/test/mhp-followup-sequence-service.test.ts orchestrator/test/portal-followup-flow-router.test.ts orchestrator/test/group-hq-sso.test.ts orchestrator/test/db/runtime-readiness.test.ts orchestrator/test/db/sql-contract.test.ts
      - name: Apply exact migrations to disposable localhost only
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/rl72-boosters-pg-bootstrap.mjs
      - name: Actual roles, cross-instance code race, rotation, reuse, revocation and operator tools
        working-directory: orchestrator
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          TEST_DATABASE_RESET_CONFIRM: reset-disposable-branch
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx --test --test-concurrency=1 test/db/operator.integration.test.ts test/db/group-hq-handoff.integration.test.ts
      - name: Fetch exact prepared 147 recovery that admits only 0148
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9feee4c1c814fed3cce01220b8051d7ba02f6db6
          path: recovery-source
          persist-credentials: false
      - name: Prepared recovery and current runtime against real148 ledger
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/operator-oauth-recovery-proof.mjs
