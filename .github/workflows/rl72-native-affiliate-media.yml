name: RL72 native affiliate media review gate
on:
  push:
    branches: ['feat/rl72-native-affiliate-creative-*']
  pull_request:
    branches: ['codex/relaunch72-platform-foundation']
    paths:
      - 'orchestrator/src/creative-studio/**'
      - 'orchestrator/src/portal/creative-studio-view.ts'
      - 'orchestrator/src/portal/product-profile.ts'
      - 'orchestrator/test/portal-product-profile.test.ts'
      - 'orchestrator/src/portal/seo-blog-router.ts'
      - 'orchestrator/src/portal/seo-blog-service.ts'
      - 'orchestrator/src/portal/creative-media-products-view.ts'
      - 'orchestrator/test/creative-media-products-view.test.ts'
      - 'orchestrator/src/creative-studio/amazon-tracking-report.ts'
      - 'orchestrator/test/amazon-tracking-report.test.ts'
      - 'orchestrator/src/creative-studio/amazon-report-pg-store.ts'
      - 'orchestrator/src/portal/creative-media-reports-view.ts'
      - 'orchestrator/test/creative-media-reports-view.test.ts'
      - 'orchestrator/src/db/migrations/0158_creative_media_reports.sql'
      - 'orchestrator/src/db/migrations/0159_creative_media_video_jobs.sql'
      - 'orchestrator/src/creative-studio/media-admission-pg-store.ts'
      - 'orchestrator/src/creative-studio/media-work-executor.ts'
      - 'orchestrator/src/creative-studio/media-video-source-pg-store.ts'
      - 'orchestrator/src/db/migrations/0160_creative_media_source_videos.sql'
      - 'orchestrator/src/db/migrations/0161_creative_source_video_private_preview.sql'
      - 'orchestrator/src/portal/media-video-byte-range.ts'
      - 'orchestrator/test/media-video-byte-range.test.ts'
      - 'orchestrator/src/portal/creative-media-video-sources-view.ts'
      - 'orchestrator/test/media-video-sources.test.ts'
      - 'orchestrator/test/media-work-executor.test.ts'
      - 'orchestrator/test/media-reconciler.test.ts'
      - 'orchestrator/src/workers/creative-media/**'
      - 'orchestrator/package.json'
      - 'orchestrator/test/media-source-probe.test.ts'
      - 'orchestrator/test/media-video-output.test.ts'
      - 'orchestrator/test/media-admission.test.ts'
      - 'orchestrator/src/portal/media-scene-timeline.ts'
      - 'orchestrator/test/media-scene-timeline.test.ts'
      - 'orchestrator/test/affiliate-creative.test.ts'
      - 'orchestrator/src/creative-studio/affiliate-direct-link.ts'
      - 'orchestrator/test/affiliate-direct-link.test.ts'
      - 'orchestrator/test/media-providers.test.ts'
      - 'orchestrator/test/db/creative-media-products-pg.integration.test.ts'
      - 'orchestrator/src/db/migrations/0157_creative_media_products.sql'
      - 'orchestrator/test/creative-studio*.test.ts'
      - '.github/workflows/rl72-native-affiliate-media.yml'
permissions:
  contents: read
jobs:
  native-creative:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck the canonical app
        run: npm --prefix orchestrator run typecheck
      - name: Affiliate intake and Creative Studio regressions
        working-directory: orchestrator
        run: node --import ./test/windows-node24-shim.mjs --import tsx --test test/media-scene-timeline.test.ts test/media-video-byte-range.test.ts test/media-video-sources.test.ts test/media-source-probe.test.ts test/media-video-output.test.ts test/media-reconciler.test.ts test/media-work-executor.test.ts test/media-admission.test.ts test/creative-media-reports-view.test.ts test/amazon-tracking-report.test.ts test/creative-media-products-view.test.ts test/affiliate-creative.test.ts test/affiliate-direct-link.test.ts test/media-providers.test.ts test/portal-product-profile.test.ts test/creative-studio.test.ts test/creative-studio-video.test.ts
      - name: Apply exact schema only to disposable localhost PG
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/rl72-boosters-pg-bootstrap.mjs
      - name: Check tenant, owner session and exact approval in real PG
        working-directory: orchestrator
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx --test test/db/creative-studio-pg.integration.test.ts test/db/creative-media-products-pg.integration.test.ts
