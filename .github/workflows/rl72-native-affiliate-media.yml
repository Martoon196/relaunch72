name: RL72 native affiliate media review gate
on:
  push:
    branches: ['feat/rl72-native-affiliate-creative-*']
  pull_request:
    branches: ['codex/relaunch72-platform-foundation']
    paths:
      - 'orchestrator/src/creative-studio/**'
      - 'orchestrator/src/portal/creative-studio-view.ts'
      - 'orchestrator/test/affiliate-creative.test.ts'
      - 'orchestrator/test/media-providers.test.ts'
      - 'orchestrator/test/creative-studio*.test.ts'
      - '.github/workflows/rl72-native-affiliate-media.yml'
permissions:
  contents: read
jobs:
  native-creative:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck the canonical app
        run: npm --prefix orchestrator run typecheck
      - name: Affiliate intake and Creative Studio regressions
        working-directory: orchestrator
        run: node --import ./test/windows-node24-shim.mjs --import tsx --test test/affiliate-creative.test.ts test/media-providers.test.ts test/creative-studio.test.ts test/creative-studio-video.test.ts
      - name: Apply exact schema only to disposable localhost PG
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/rl72-boosters-pg-bootstrap.mjs
      - name: Check tenant, owner session and exact approval in real PG
        working-directory: orchestrator
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx --test test/db/creative-studio-pg.integration.test.ts
