name: MHP payments exact-source gate
on:
  push:
    branches: [codex/mhp-payments-integrate-20261106, codex/mhp-payments-0142-bridge-20261106]
permissions:
  contents: read
jobs:
  payments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/supply-chain.mjs --check
      - run: npm run typecheck
      - name: Prepare disposable localhost schema
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/rl72-boosters-pg-bootstrap.mjs
      - name: Payment receipt and welcome proof under runtime roles
        if: github.ref_name != 'codex/mhp-payments-0142-bridge-20261106'
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import { readFile } from 'node:fs/promises';
          const pool = new pg.Pool({connectionString:'postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test',max:1});
          try {
            const proof = await readFile('orchestrator/test/db/mhp-purchase-welcome.proof.sql','utf8');
            await pool.query('BEGIN;\n'+proof+'\nROLLBACK;');
            console.log('PASS: purchase welcome runtime-role proof; synthetic data rolled back');
          } finally { await pool.end(); }
          NODE
      - name: Complete offline suite
        env:
          RELAUNCH72_DATABASE_INTEGRATION: ''
          TEST_DATABASE_URL: ''
        run: npm test
