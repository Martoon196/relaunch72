name: RL72 Boosters disposable PostgreSQL proof
on:
  push:
    branches: [codex/rl72-boosters-integration-20261104]
    paths:
      - 'orchestrator/src/**'
      - 'orchestrator/test/**'
      - 'orchestrator/method-packs/**'
      - 'scripts/rl72-boosters-pg-bootstrap.mjs'
      - '.github/workflows/rl72-boosters-proof.yml'
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
      RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript gate
        run: npm --prefix orchestrator run typecheck
      - name: Apply migrations only to disposable localhost database
        run: node --import tsx scripts/rl72-boosters-pg-bootstrap.mjs
      - name: Exercise real PostgreSQL method boundaries
        working-directory: orchestrator
        run: node --import tsx --test test/db/rl72-method-packs-pg.integration.test.ts test/db/rl72-creators-pg.integration.test.ts
      - name: Offline full suite
        env:
          RL72_METHODS_PG_TEST_URL: ''
        run: npm --prefix orchestrator test
