name: Exact SEO137 bridge normal gate
'on':
  push:
    branches:
    - codex/r72-seo137-bridge-proof-20261103
    paths:
    - .github/workflows/mhp-linux-proof.yml
permissions:
  contents: read
jobs:
  normal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout exact reviewed bridge
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: Martoon196/relaunch72
        ref: 0b602df7a6b902ffe27b3bb1f69c2bc6155ffe40
        persist-credentials: false
    - name: Assert exact clean source
      run: 'test "$(git rev-parse HEAD)" = 0b602df7a6b902ffe27b3bb1f69c2bc6155ffe40

        test "$(git rev-parse HEAD^{tree})" = c217651a63380ccd591d17d5c748492c19427bc1

        test -z "$(git status --porcelain)"'
    - name: Match existing runtime
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - name: Install exact lockfile
      run: npm ci --ignore-scripts --include=dev
    - name: Check supply chain
      run: node scripts/supply-chain.mjs --check
    - name: Whole project typecheck
      run: npm run typecheck
    - name: Normal release suite
      run: npm test
