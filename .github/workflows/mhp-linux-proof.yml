name: SEO exact Linux proof
on:
  push:
    branches: [codex/mhp-linux-proof-20261031]
    paths: [.github/workflows/mhp-linux-proof.yml]
permissions:
  contents: read
jobs:
  exact-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed SEO release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: 75ee4208d9cd1ce5d605b61be2db7f96a20427b0
          persist-credentials: false
      - name: Assert exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 75ee4208d9cd1ce5d605b61be2db7f96a20427b0
          test "$(git rev-parse 'HEAD^{tree}')" = 8bdc7edfa5ae4304dbe89ff8de1a8dbe299c6d39
          test -z "$(git status --porcelain)"
          git rev-parse HEAD 'HEAD^{tree}'
      - name: Match Render runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --include=dev
      - name: Check supply chain
        run: node scripts/supply-chain.mjs --check
      - name: Typecheck whole project
        run: npm run typecheck
      - name: Run whole normal suite
        run: npm test
