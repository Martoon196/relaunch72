name: Central content exact PostgreSQL proof
on:
  push:
    branches: [codex/mhp-linux-proof-20261031]
    paths: [.github/workflows/mhp-linux-proof.yml]
permissions:
  contents: read
jobs:
  exact-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test
      TEST_DATABASE_RESET_CONFIRM: reset-disposable-branch
      TEST_DATABASE_SSL_MODE: disable
    steps:
      - name: Model the managed PostgreSQL migration identity
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$PG_CONTAINER" psql -U postgres -d relaunch72_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE ci_migrator LOGIN CREATEROLE CREATEDB PASSWORD 'ci-owner-test-only'; ALTER DATABASE relaunch72_test OWNER TO ci_migrator;"
      - name: Checkout exact reviewed release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: edfbcf53732fd8e807ed42f27bb1be22c12e035b
          persist-credentials: false
      - name: Assert exact source identity
        run: |
          test "$(git rev-parse HEAD)" = edfbcf53732fd8e807ed42f27bb1be22c12e035b
          test "$(git rev-parse 'HEAD^{tree}')" = 40206f5c6a574244512686fe7086424004a8c5eb
          test -z "$(git status --porcelain)"
          git rev-parse HEAD 'HEAD^{tree}'
      - name: Match Render runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --include=dev
      - name: Check supply chain
        run: node scripts/supply-chain.mjs --check
      - name: Inject bounded competing-intent challenge after exact source assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('orchestrator/test/db/seo-blog-social-promotion.integration.test.ts')
          s=p.read_text()
          needle='    const first = await planFor(slot);'
          assert s.count(needle)==1
          replacement='''    await a.registerSocialBinding(actorA, brandA.id, { network: 'linkedin', providerAccountId: LINKEDIN_A, dailyCap: 5, monthlyCap: 10 });
              const concurrent = await Promise.allSettled([planFor(slot), planFor(new Date(slot.getTime() + 60_000))]);
              const accepted = concurrent.filter(x => x.status === 'fulfilled');
              const rejected = concurrent.filter(x => x.status === 'rejected');
              assert.equal(accepted.length, 1, 'two overlapping real serializable registry.plan transactions must admit only one active promotion');
              assert.equal(rejected.length, 1);
              const persisted = await admin.query('SELECT count(*)::int AS n FROM app.property_predator_owned_social_jobs WHERE workspace_id = $1', [brandA.id]);
              assert.equal(persisted.rows[0].n, 1, 'one actual canonical job persisted for the two distinct competing slots');
              console.info('ROOT_SQL_CONCURRENCY_PROVED: distinctSlots=2 caps=5/10 admitted=' + accepted.length + ' rejected=' + rejected.length + ' persistedJobs=' + persisted.rows[0].n + ' providerEffects=0');
              return;
          '''
          s=s.replace(needle,replacement)
          p.write_text(s)
          PY
      - name: Run real-role serializable admission concurrency challenge only
        env:
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: cd orchestrator && node --import ./test/windows-node24-shim.mjs --import tsx --test test/db/seo-blog-social-promotion.integration.test.ts
