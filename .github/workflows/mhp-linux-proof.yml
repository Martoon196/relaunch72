name: Central content exact PostgreSQL proof
on:
  push:
    branches: [codex/mhp-linux-proof-20261031]
    paths: [.github/workflows/mhp-linux-proof.yml]
permissions:
  contents: read
jobs:
  exact-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test
      TEST_DATABASE_RESET_CONFIRM: reset-disposable-branch
      TEST_DATABASE_SSL_MODE: disable
    steps:
      - name: Model the managed PostgreSQL migration identity
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$PG_CONTAINER" psql -U postgres -d relaunch72_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE ci_migrator LOGIN CREATEROLE CREATEDB PASSWORD 'ci-owner-test-only'; ALTER DATABASE relaunch72_test OWNER TO ci_migrator;"
      - name: Checkout exact reviewed release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: 75ee4208d9cd1ce5d605b61be2db7f96a20427b0
          persist-credentials: false
      - name: Assert exact source identity
        run: |
          test "$(git rev-parse HEAD)" = 75ee4208d9cd1ce5d605b61be2db7f96a20427b0
          test "$(git rev-parse 'HEAD^{tree}')" = 8bdc7edfa5ae4304dbe89ff8de1a8dbe299c6d39
          test -z "$(git status --porcelain)"
          git rev-parse HEAD 'HEAD^{tree}'
      - name: Match Render runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --include=dev
      - name: Check supply chain
        run: node scripts/supply-chain.mjs --check
      - name: Inject one bounded pause challenge into the existing disposable journey
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('orchestrator/test/db/seo-blog-social-promotion.integration.test.ts')
          s=p.read_text()
          needle='    const workerStore = new PgSeoBlogStore'
          assert s.count(needle)==1
          inject='''    const pauseBrand = await a.getBrand(actorA, brandA.id);
              await a.updateSettings(actorA, brandA.id, pauseBrand.rowVersion, { pauseAll: true });
              assert.equal((await a.getBrand(actorA, brandA.id)).settings.pauseAll, true);
              console.info('ROOT_PAUSE_CHALLENGE: pauseAll=true before JIT and begin-call');
          '''
          s=s.replace(needle,inject+needle)
          needle2="    assert.equal((await jobRow(first.result.jobId)).state, 'succeeded', 'the 0085 terminal receipt state');"
          assert s.count(needle2)==1
          s=s.replace(needle2,needle2+"\n    console.info('ROOT_PAUSE_REPRODUCED: pauseAll=true, providerStubEffects=' + published.length + ', job=succeeded');\n    return;")
          p.write_text(s)
          PY
      - name: Run real-role paused dispatch challenge only
        env:
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: cd orchestrator && node --import ./test/windows-node24-shim.mjs --import tsx --test test/db/seo-blog-social-promotion.integration.test.ts
