name: SEO content UX exact Linux proof
on:
  push:
    branches: [codex/r72-content-ux-proof-20261101]
    paths: [.github/workflows/mhp-linux-proof.yml]
permissions:
  contents: read
jobs:
  exact-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed content UX source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: 111adc52a3d69bc9b1addbf2e7efce67264064a9
          persist-credentials: false
      - name: Assert exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 111adc52a3d69bc9b1addbf2e7efce67264064a9
          test "$(git rev-parse 'HEAD^{tree}')" = 625ff14eaec6e20df869307da98282656f603ed4
          test -z "$(git status --porcelain)"
          git rev-parse HEAD 'HEAD^{tree}'
      - name: Match Render runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --include=dev
      - name: Check supply chain
        run: node scripts/supply-chain.mjs --check
      - name: Typecheck whole project
        run: npm run typecheck
      - name: Run whole normal suite
        run: npm test
