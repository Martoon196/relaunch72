name: SEO media exact component PostgreSQL proof
on:
  push:
    branches: [codex/r72-media-storage-0101-proof-20261103]
    paths: [.github/workflows/mhp-linux-proof.yml]
permissions:
  contents: read
jobs:
  media-storage-and-populated-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test
      TEST_DATABASE_RESET_CONFIRM: reset-disposable-branch
      TEST_DATABASE_SSL_MODE: disable
      RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
      DATABASE_MIGRATOR_URL: postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test
      DATABASE_SSL_MODE: disable
      NODE_ENV: development
      R72_MEDIA_SOURCE_SHA: b90cec06476d4ac9cfc4a9e7347c5e145a69ca89
      R72_MEDIA_SOURCE_TREE: dd68c2c8f0f4fd6a2db3e3816cb4c7bee150476f
      R72_MEDIA_dc99759048adb4fb0a3686e0e6d85596e54b46a88938de08a892b65a85821466: dc99759048adb4fb0a3686e0e6d85596e54b46a88938de08a892b65a85821466
      R72_MEDIA_9e57c35c8ffdec892f49bae02d96827855a792e1: 9e57c35c8ffdec892f49bae02d96827855a792e1
    steps:
      - name: Model the managed PostgreSQL migration identity
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$PG_CONTAINER" psql -U postgres -d relaunch72_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE ci_migrator LOGIN CREATEROLE CREATEDB PASSWORD 'ci-owner-test-only'; ALTER DATABASE relaunch72_test OWNER TO ci_migrator;"
      - name: Checkout exact reviewed media SQL component
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: b90cec06476d4ac9cfc4a9e7347c5e145a69ca89
          persist-credentials: false
      - name: Assert exact component identity
        run: |
          test "$(git rev-parse HEAD)" = b90cec06476d4ac9cfc4a9e7347c5e145a69ca89
          test "$(git rev-parse 'HEAD^{tree}')" = dd68c2c8f0f4fd6a2db3e3816cb4c7bee150476f
          test -z "$(git status --porcelain)"
      - name: Checkout unchanged135 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: 2456c48fca7370f29744de3f57551df44136628e
          path: baseline
          persist-credentials: false
      - name: Checkout exact reviewed135 compatibility bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: 9e57c35c8ffdec892f49bae02d96827855a792e1
          path: bridge
          persist-credentials: false
      - name: Assert pinned baseline and bridge identities
        run: |
          test "$(git -C baseline rev-parse HEAD)" = 2456c48fca7370f29744de3f57551df44136628e
          test "$(git -C bridge rev-parse HEAD)" = 9e57c35c8ffdec892f49bae02d96827855a792e1
          test "$(git -C bridge rev-parse 'HEAD^{tree}')" = 3b39b982988825fe89b323232c8d15fff057357a
          test -z "$(git -C baseline status --porcelain)"
          test -z "$(git -C bridge status --porcelain)"
          cmp package-lock.json baseline/package-lock.json
          cmp package-lock.json bridge/package-lock.json
      - name: Match existing runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Install exact unchanged lockfile once
        run: |
          npm ci --ignore-scripts --include=dev
          ln -s "$GITHUB_WORKSPACE/node_modules" baseline/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" bridge/node_modules
      - name: Verify control proof artifact bytes
        run: |
          printf '%s' '' | base64 -d > /tmp/r72-rehearse-136.mjs
          echo '4681d93b3a9ffe70d0676d8b525f32313d36c430a71fa4c35fe6ce90c00486ef  /tmp/r72-rehearse-136.mjs' | sha256sum --check
      - name: Populate135 with the existing genuine-role social journey
        run: cd baseline/orchestrator && node --import ./test/windows-node24-shim.mjs --import tsx --test --test-concurrency=1 test/db/seo-blog-social-promotion.integration.test.ts
      - name: Snapshot populated old records and exercise135 bridge roles
        run: node --import tsx /tmp/r72-rehearse-136.mjs before
      - name: Apply ordinary frozen migration command
        run: npm run db:migrate
      - name: Check exact current migration ledger
        run: npm run db:check
      - name: Prove preserved data, privileges, disabled image policy and actual bridge roles
        run: node --import tsx /tmp/r72-rehearse-136.mjs after
      - name: Assemble exact frozen test prefix plus supplemental concurrency control
        run: |
          node -e "const f=require('node:fs'),c=require('node:crypto');const original=f.readFileSync('orchestrator/test/db/seo-blog-media-storage.integration.test.ts'),extra=Buffer.from('','base64');const h=b=>c.createHash('sha256').update(b).digest('hex');if(h(original)!=='e357f642411ea0f4b346da0f619407fe5686cf1bd45004af0a3ec00cff88be3d'||h(extra)!=='27ea50694f5f4c560ae25d06a23491a2f11d8f602ab833cb7d4f68ad1672ae21')throw Error('Control proof source mismatch');const copy=Buffer.concat([original,extra]);if(!copy.subarray(0,original.length).equals(original))throw Error('Frozen prefix changed');f.writeFileSync('orchestrator/test/db/seo-blog-media-root-proof.integration.test.ts',copy);console.log(JSON.stringify({frozenTestSha256:h(original),supplementalSha256:h(extra),prefixUnchanged:true,productionSourceEdited:false}));"
      - name: Run named genuine-role source diagnostic
        run: cd orchestrator && node --import ./test/windows-node24-shim.mjs --import tsx --test --test-concurrency=1 --test-name-pattern='CONTROL ONLY:' test/db/seo-blog-media-root-proof.integration.test.ts
