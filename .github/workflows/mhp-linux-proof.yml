name: Exact023 isolated PostgreSQL media gates
permissions:
  contents: read
jobs:
  isolated-final-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
    - name: Checkout exact023 final source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: Martoon196/relaunch72
        ref: 2bd32194a3a33d6e43cfa1b29d5b0769598fc137
        persist-credentials: false
    - name: Bind source tree parent SQL lock and exact two tests
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 2bd32194a3a33d6e43cfa1b29d5b0769598fc137

        test "$(git rev-parse HEAD^{tree})" = 1679f413e7ef278ac9dc3c6a2a9ebb29cce51b00

        test "$(git cat-file -p HEAD | sed -n ''s/^parent //p'')" = 0b602df7a6b902ffe27b3bb1f69c2bc6155ffe40

        test -z "$(git status --porcelain)"

        echo ''9bb9b0998d98f4b678b5f7dd026a5f38633eec144b0e20515f647914668c70cc  package-lock.json''
        | sha256sum --check

        echo ''ff85dc3ee825e2529333fc8efb0de070a05e43786717d9ae279aa469e41e1255  orchestrator/src/db/migrations/0137_seo_blog_media_storage.sql''
        | sha256sum --check

        echo ''9bf6605cdc536794fae989964542eb8253cdd49ebd995d3e6dd346c01c746139  orchestrator/src/db/migrations/0136_mhp_webinar_applications.sql''
        | sha256sum --check

        echo ''ecfa83df56db1df9bb4d4876bfd3f188c0a536235b7f24dc79a0abdc21c491f1  orchestrator/test/db/seo-blog-media-engine.integration.test.ts''
        | sha256sum --check

        echo ''433d298178d1a4eb835427b3c67fce30229512b562f5148e943ddc5f4cba1f5f  orchestrator/test/db/seo-blog-media-storage.integration.test.ts''
        | sha256sum --check'
    - name: Match existing runtime
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - name: Verify retained exact normal and preservation receipts
      shell: bash
      run: 'set -euo pipefail

        printf ''%s'' ''''
        | base64 -d > /tmp/r72-media-137-manifest.json

        echo ''555644b8cb88441a43e0801d9856f73cd852a8507227d02353b08394456939b1  /tmp/r72-media-137-manifest.json''
        | sha256sum --check

        printf ''%s'' ''''
        | base64 -d > /tmp/retainedNormal.json

        echo ''cf8c2ba8d53fdb6421030cf39a6fc5476dedb6cd055bebf3504fe4120791f2d4  /tmp/retainedNormal.json''
        | sha256sum --check

        printf ''%s'' ''''
        | base64 -d > /tmp/retainedPreservation.json

        echo ''14f69cecbcecee741d5e24b86301cf183a35ed27ace1adacf21941caf0fbf0b8  /tmp/retainedPreservation.json''
        | sha256sum --check'
    - name: Install exact dependencies once
      run: npm ci --ignore-scripts --include=dev
    - name: Create non-super disposable migration identity
      shell: bash
      env:
        PG_CONTAINER: ${{ job.services.postgres.id }}
      run: 'set -euo pipefail

        docker exec "$PG_CONTAINER" psql -U postgres -d relaunch72_test -v ON_ERROR_STOP=1
        -c "CREATE ROLE ci_migrator LOGIN NOSUPERUSER NOBYPASSRLS CREATEROLE CREATEDB
        PASSWORD ''ci-owner-test-only''; ALTER DATABASE relaunch72_test OWNER TO ci_migrator;"

        {

        echo ''TEST_DATABASE_URL=postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test''

        echo ''TEST_DATABASE_RESET_CONFIRM=reset-disposable-branch''

        echo ''TEST_DATABASE_SSL_MODE=disable''

        echo ''RELAUNCH72_DATABASE_INTEGRATION=explicit-disposable-run''

        echo ''DATABASE_MIGRATOR_URL=postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test''

        echo ''DATABASE_SSL_MODE=disable''

        echo ''NODE_ENV=development''

        } >> "$GITHUB_ENV"'
    - name: Run unchanged media file against own fresh PG18 cluster
      shell: bash
      env:
        TEST_FILE: ${{ matrix.file }}
        EXPECTED_TESTS: ${{ matrix.expected }}
      run: 'set -euo pipefail

        cd orchestrator

        node --import ./test/windows-node24-shim.mjs --import tsx --test --test-reporter=tap
        --test-concurrency=1 "$TEST_FILE" 2>&1 | tee /tmp/r72-media-137-isolated-pg.log

        grep -qx "# tests $EXPECTED_TESTS" /tmp/r72-media-137-isolated-pg.log

        grep -qx "# pass $EXPECTED_TESTS" /tmp/r72-media-137-isolated-pg.log

        grep -qx ''# fail 0'' /tmp/r72-media-137-isolated-pg.log

        grep -qx ''# skipped 0'' /tmp/r72-media-137-isolated-pg.log

        grep -qx ''# cancelled 0'' /tmp/r72-media-137-isolated-pg.log

        node --input-type=module -e ''console.log(JSON.stringify({proof:"isolated-final-pg",source:"2bd32194a3a33d6e43cfa1b29d5b0769598fc137",tree:"1679f413e7ef278ac9dc3c6a2a9ebb29cce51b00",file:process.env.TEST_FILE,pass:Number(process.env.EXPECTED_TESTS),fail:0,skipped:0,cancelled:0,productionCredentials:false,providerCalls:0}))''

        '
    name: Exact023 PG ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: engine
          file: test/db/seo-blog-media-engine.integration.test.ts
          expected: 1
        - name: storage
          file: test/db/seo-blog-media-storage.integration.test.ts
          expected: 2
'on':
  push:
    branches:
    - codex/r72-media-137-isolated-v4-proof-20261103
    paths:
    - .github/workflows/mhp-linux-proof.yml
