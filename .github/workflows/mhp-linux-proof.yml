name: MHP mobile handoff exact Linux proof

on:
  push:
    branches: [codex/mhp-linux-proof-20261031]
    paths: [.github/workflows/mhp-linux-proof.yml]

permissions:
  contents: read

jobs:
  exact-source-gate:
    name: ${{ matrix.target }} exact Linux gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mobile-handoff
            commit: 8c657fac26d21922ece228ba5166ab48b89f4afe
            tree: 71641db42722f46240c063b6fe05bd3b2586c3d0
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - name: Match Render runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Verify and record exact source and runtime
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_COMMIT: ${{ matrix.commit }}
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const commit = git('rev-parse', 'HEAD');
          const tree = git('rev-parse', 'HEAD^{tree}');
          assert.equal(commit, process.env.EXPECTED_COMMIT);
          assert.equal(tree, process.env.EXPECTED_TREE);
          assert.equal(git('status', '--porcelain'), '');
          assert.equal(process.platform, 'linux');
          assert.equal(process.version, 'v22.23.4');
          console.log(JSON.stringify({
            target: process.env.EXPECTED_TARGET, commit, tree, clean: true,
            platform: process.platform, arch: process.arch,
            node: process.version, versions: process.versions,
            npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
          }));
          NODE
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --include=dev
      - name: Check supply chain
        run: node scripts/supply-chain.mjs --check
      - name: Typecheck whole project
        run: npm run typecheck
      - name: Run whole normal suite
        run: npm test
