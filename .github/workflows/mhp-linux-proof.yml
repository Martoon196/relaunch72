name: SEO media137 exact normal and populated cutover
on:
  push:
    branches: [codex/r72-media-137-proof-20261103]
    paths: [.github/workflows/mhp-linux-proof.yml]
permissions:
  contents: read
concurrency:
  group: seo-media137-exact-disposable-proof
  cancel-in-progress: false
jobs:
  exact-normal-and-populated137-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact reconciled capable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: 413bd668e3ffdc9f2aa98bd55d657eaabc28cca5
          persist-credentials: false
      - name: Assert exact source, tree and frozen blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 413bd668e3ffdc9f2aa98bd55d657eaabc28cca5
          test "$(git rev-parse 'HEAD^{tree}')" = 9f51a5bf9b3a6be47fbb9546acc4d4a31253ea70
          test "$(git cat-file -p HEAD | sed -n 's/^parent //p')" = 0b602df7a6b902ffe27b3bb1f69c2bc6155ffe40
          test -z "$(git status --porcelain)"
          echo '9bb9b0998d98f4b678b5f7dd026a5f38633eec144b0e20515f647914668c70cc  package-lock.json' | sha256sum --check
          echo '9bf6605cdc536794fae989964542eb8253cdd49ebd995d3e6dd346c01c746139  orchestrator/src/db/migrations/0136_mhp_webinar_applications.sql' | sha256sum --check
          echo 'ff85dc3ee825e2529333fc8efb0de070a05e43786717d9ae279aa469e41e1255  orchestrator/src/db/migrations/0137_seo_blog_media_storage.sql' | sha256sum --check
          echo '63273dc50f3ea958b5691a9b8c85885482aed2f8f025c9dc75daad14f341d33d  orchestrator/test/db/seo-blog-media-storage.integration.test.ts' | sha256sum --check
          echo '5740b3f057db0c00cf5ab203b6d5865be3b47bfdb2a5485a955d4d945324ed27  orchestrator/test/db/seo-blog-media-engine.integration.test.ts' | sha256sum --check
      - name: Match exact existing Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Verify local control artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/r72-media-137-manifest.json
          echo '3ea1f9feeea7b324407fbbdacb05406fb4ab34381ff662dace8f7c73576767ac  /tmp/r72-media-137-manifest.json' | sha256sum --check
          printf '%s' '' | base64 -d > /tmp/rehearse-137.mjs
          echo '673d2b5881065b5b75692e02b3f49b695be671cf8920fe3b2aa239c01e95fc6b  /tmp/rehearse-137.mjs' | sha256sum --check
          printf '%s' '' | base64 -d > /tmp/seed-mhp136.mjs
          echo 'cefba098bed42ea71020df7b20bea024675f3f607bd00c90f391568c68686609  /tmp/seed-mhp136.mjs' | sha256sum --check
          printf '%s' '' | base64 -d > /tmp/verify-dependency-sharing.mjs
          echo 'f2ed39369730e135359a26a016fc90150e493b9965a2827cf174a7d6cc8cd4bb  /tmp/verify-dependency-sharing.mjs' | sha256sum --check
          printf '%s' '' | base64 -d > /tmp/normal-receipt.mjs
          echo '50da3d0d271e6950e7ffb1efc99191379ce8c2c5e71b9bf932e904fc40a589b2  /tmp/normal-receipt.mjs' | sha256sum --check
      - name: Install final exact dependencies once
        run: npm ci --ignore-scripts --include=dev
      - name: Whole TypeScript, SBOM and normal suite
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = 22.23.4
          npm run typecheck
          npm run supply-chain:check
          npm test 2>&1 | tee /tmp/r72-media-137-normal.log
      - name: Emit exact normal receipt before any database integration
        run: node /tmp/normal-receipt.mjs
      - name: Checkout exact live136 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: 8c657fac26d21922ece228ba5166ab48b89f4afe
          path: baseline
          persist-credentials: false
      - name: Checkout exact136 to137 compatibility bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Martoon196/relaunch72
          ref: 0b602df7a6b902ffe27b3bb1f69c2bc6155ffe40
          path: bridge
          persist-credentials: false
      - name: Assert baseline and bridge identities and dependency compatibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = 8c657fac26d21922ece228ba5166ab48b89f4afe
          test "$(git -C baseline rev-parse 'HEAD^{tree}')" = 71641db42722f46240c063b6fe05bd3b2586c3d0
          test "$(git -C bridge rev-parse HEAD)" = 0b602df7a6b902ffe27b3bb1f69c2bc6155ffe40
          test "$(git -C bridge rev-parse 'HEAD^{tree}')" = c217651a63380ccd591d17d5c748492c19427bc1
          test "$(git -C bridge cat-file -p HEAD | sed -n 's/^parent //p')" = 8c657fac26d21922ece228ba5166ab48b89f4afe
          test -z "$(git -C baseline status --porcelain)"
          test -z "$(git -C bridge status --porcelain)"
          node /tmp/verify-dependency-sharing.mjs
          ln -s "$GITHUB_WORKSPACE/node_modules" baseline/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" bridge/node_modules
      - name: Model non-superuser managed migration owner after normal tests
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -U postgres -d relaunch72_test -v ON_ERROR_STOP=1 -c "CREATE ROLE ci_migrator LOGIN CREATEROLE CREATEDB PASSWORD 'ci-owner-test-only'; ALTER DATABASE relaunch72_test OWNER TO ci_migrator;"
          {
            echo 'TEST_DATABASE_URL=postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test'
            echo 'TEST_DATABASE_RESET_CONFIRM=reset-disposable-branch'
            echo 'TEST_DATABASE_SSL_MODE=disable'
            echo 'RELAUNCH72_DATABASE_INTEGRATION=explicit-disposable-run'
            echo 'DATABASE_MIGRATOR_URL=postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test'
            echo 'DATABASE_SSL_MODE=disable'
            echo 'NODE_ENV=development'
            echo 'R72_MEDIA_SOURCE_SHA=413bd668e3ffdc9f2aa98bd55d657eaabc28cca5'
            echo 'R72_MEDIA_SOURCE_TREE=9f51a5bf9b3a6be47fbb9546acc4d4a31253ea70'
            echo 'R72_MEDIA_SQL_SHA=ff85dc3ee825e2529333fc8efb0de070a05e43786717d9ae279aa469e41e1255'
            echo 'R72_MHP136_SQL_SHA=9bf6605cdc536794fae989964542eb8253cdd49ebd995d3e6dd346c01c746139'
            echo 'R72_MEDIA_BASELINE_SHA=8c657fac26d21922ece228ba5166ab48b89f4afe'
            echo 'R72_MEDIA_BASELINE_TREE=71641db42722f46240c063b6fe05bd3b2586c3d0'
            echo 'R72_MEDIA_BRIDGE_SHA=0b602df7a6b902ffe27b3bb1f69c2bc6155ffe40'
            echo 'R72_MEDIA_BRIDGE_TREE=c217651a63380ccd591d17d5c748492c19427bc1'
          } >> "$GITHUB_ENV"
      - name: Populate exact136 with existing genuine-role social journey
        shell: bash
        run: |
          set -euo pipefail
          cd baseline/orchestrator
          node --import ./test/windows-node24-shim.mjs --import tsx --test --test-reporter=tap --test-concurrency=1 test/db/seo-blog-social-promotion.integration.test.ts 2>&1 | tee /tmp/r72-media-137-baseline.log
          grep -qx '# pass 1' /tmp/r72-media-137-baseline.log
          grep -qx '# fail 0' /tmp/r72-media-137-baseline.log
          grep -qx '# skipped 0' /tmp/r72-media-137-baseline.log
      - name: Populate MHP136 and snapshot all old rows, columns, ACLs and installation
        run: node --import tsx /tmp/rehearse-137.mjs before
      - name: Apply ordinary frozen137 migration
        run: npm run db:migrate
      - name: Ordinary exact ledger check
        run: npm run db:check
      - name: Verify all136 data and ACLs, MHP state, five readers and two denials
        run: node --import tsx /tmp/rehearse-137.mjs after
      - name: Run only the two frozen media files serially
        shell: bash
        run: |
          set -euo pipefail
          cd orchestrator
          node --import ./test/windows-node24-shim.mjs --import tsx --test --test-reporter=tap --test-concurrency=1 test/db/seo-blog-media-storage.integration.test.ts test/db/seo-blog-media-engine.integration.test.ts 2>&1 | tee /tmp/r72-media-137-final-pg.log
          grep -qx '# tests 3' /tmp/r72-media-137-final-pg.log
          grep -qx '# pass 3' /tmp/r72-media-137-final-pg.log
          grep -qx '# fail 0' /tmp/r72-media-137-final-pg.log
          grep -qx '# skipped 0' /tmp/r72-media-137-final-pg.log
