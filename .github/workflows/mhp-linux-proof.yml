name: Exact media compatibility bridge normal release gate
'on':
  push:
    branches:
    - codex/r72-media-136-bridge-proof-20261103
    paths:
    - .github/workflows/mhp-linux-proof.yml
permissions:
  contents: read
jobs:
  exact-bridge-normal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout exact reviewed compatibility bridge
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: Martoon196/relaunch72
        ref: 21ae9d2027f9f1fabe3b8e73dadfee361d22a5f5
        persist-credentials: false
    - name: Bind exact source identity
      run: 'test "$(git rev-parse HEAD)" = 21ae9d2027f9f1fabe3b8e73dadfee361d22a5f5

        test "$(git rev-parse HEAD^{tree})" = 7b3a2471f349f24a6823ff12f360961b590dcab1

        test -z "$(git status --porcelain)"'
    - name: Match existing Render runtime
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22.23.4
    - name: Install exact lockfile
      run: npm ci --ignore-scripts --include=dev
    - name: Check supply chain
      run: node scripts/supply-chain.mjs --check
    - name: Whole project typecheck
      run: npm run typecheck
    - name: Normal release suite
      run: npm test
