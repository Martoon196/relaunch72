name: Group HQ brand webinars exact-source gate
on:
  push:
    branches: [codex/ghq-webinars-release-20261110]
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript and supply-chain gates
        run: |
          npm run typecheck
          node scripts/supply-chain.mjs --check
      - name: Changed sign-in, webinar and preserved playback neighbours
        run: node --import tsx --test orchestrator/test/group-hq-sso.test.ts orchestrator/test/webinars.test.ts orchestrator/test/central-content-mount.test.ts orchestrator/test/webinars-player-recovery.test.mjs
      # Camera/mic/live/replay accepted on released e70df31. Media code unchanged.
      # Retain the native146 browser/encoder proof rather than repeat that environment.
      - name: Apply exact migrations to disposable localhost only
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/rl72-boosters-pg-bootstrap.mjs
      - name: Actual roles, cross-instance replay, MHP ownership, CRM and email jobs
        working-directory: orchestrator
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          TEST_DATABASE_RESET_CONFIRM: reset-disposable-branch
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx --test --test-concurrency=1 test/db/group-hq-handoff.integration.test.ts test/db/native-webinars.integration.test.ts test/db/native-webinars-http.integration.test.ts
      - name: Fetch exact prepared native146 recovery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 47e5f28d5e3ad225a091c2a36b7df09927fd9817
          path: recovery-source
          persist-credentials: false
      - name: Published recovery and current runtime against real147 ledger
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/group-hq-webinars-recovery-proof.mjs
