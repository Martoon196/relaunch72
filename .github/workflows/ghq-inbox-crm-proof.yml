name: Growth HQ inbox CRM exact-source gate
on:
  push:
    branches: [codex/ghq-inbox-crm-20261106, codex/r72-ghq-wa-004-integration, codex/mhp-wa-inbox-005a-bridge, codex/mhp-wa-inbox-005a-release]
permissions:
  contents: read
jobs:
  crm-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: relaunch72_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix orchestrator run typecheck
      - name: Existing CRM neighbours and inbox command boundary
        working-directory: orchestrator
        run: node --import tsx --test test/group-hq-inbox-crm.test.ts test/crm-pg.test.ts test/portal-crm-pg-service.test.ts test/group-hq-crm-read.test.ts
      - name: WhatsApp transports and database compatibility
        working-directory: orchestrator
        run: node --import tsx --test test/meta-whatsapp-live-foundation.test.ts test/meta-whatsapp-live-worker.test.ts test/db/runtime-readiness.test.ts
      - name: Apply exact migrations
        env:
          RL72_METHODS_PG_TEST_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/relaunch72_test
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx scripts/rl72-boosters-pg-bootstrap.mjs
      - name: Real CRM roles, replay, concurrent create and workspace isolation
        working-directory: orchestrator
        env:
          TEST_DATABASE_URL: postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test
          TEST_DATABASE_RESET_CONFIRM: reset-disposable-branch
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx --test test/db/group-hq-inbox-crm.integration.test.ts
      - name: Signed WhatsApp transcript and messaging evidence under the web role
        working-directory: orchestrator
        env:
          TEST_DATABASE_URL: postgresql://ci_migrator:ci-owner-test-only@127.0.0.1:5432/relaunch72_test
          TEST_DATABASE_RESET_CONFIRM: reset-disposable-branch
          RELAUNCH72_DATABASE_INTEGRATION: explicit-disposable-run
        run: node --import tsx --test --test-name-pattern '0062 exposes exact live rail evidence' test/db/operational-inbox-live-read-boundary.integration.test.ts
