name: Booking candidate
on:
  pull_request:
    branches: [codex/relaunch72-platform-foundation]
    paths:
      - 'orchestrator/**'
      - 'package*.json'
      - '.github/workflows/booking-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run supply-chain:check
      - run: npm run typecheck
      - run: npm test
      # Real-role/race proof is separately bound to the migration checksum on
      # an isolated Neon branch. No production/provider credentials enter CI.
