# Growth HQ Webinars — one API Worker in front of D1, Durable Objects, Stream and Queues.
name = "ghq-webinars"
main = "src/worker.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Same Worker answers the API, the embed CDN and hosted pages.
routes = [
  { pattern = "api.webinars.growthhq.app/*", zone_name = "growthhq.app" },
  { pattern = "cdn.webinars.growthhq.app/*", zone_name = "growthhq.app" },
  { pattern = "webinars.growthhq.app/*", zone_name = "growthhq.app" },
]

# Embed bundle (npm run build:embed → public/v1/*). Worker runs first so /v1 API routes win.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/v1/*", "!/v1/embed*", "!/v1/chunks/*", "/w/*", "/frame/*", "/hooks/*", "/health"]

[vars]
PUBLIC_ORIGIN = "https://webinars.growthhq.app"     # hosted pages + iframe fallback
API_ORIGIN = "https://api.webinars.growthhq.app"
CDN_ORIGIN = "https://cdn.webinars.growthhq.app"
STREAM_CUSTOMER_CODE = "REPLACE_ME"                  # customer-<code>.cloudflarestream.com
TURNSTILE_SITE_KEY = "REPLACE_ME"
# Secrets (wrangler secret put …): TOKEN_SECRET, DATA_KEY, CF_ACCOUNT_ID, CF_STREAM_API_TOKEN,
# STREAM_SIGNING_KEY_ID, STREAM_SIGNING_JWK, STREAM_WEBHOOK_SECRET, TURNSTILE_SECRET, BOOTSTRAP_TOKEN

# EU jurisdiction for GDPR: create with `wrangler d1 create webinars --location weur`
[[d1_databases]]
binding = "DB"
database_name = "webinars"
database_id = "REPLACE_ME"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

[[queues.producers]]
binding = "WEBHOOKS"
queue = "ghq-webinar-webhooks"

[[queues.consumers]]
queue = "ghq-webinar-webhooks"
max_batch_size = 25
max_batch_timeout = 2
max_retries = 20                 # retries are paced by the consumer (exponential, ~24h total)
dead_letter_queue = "ghq-webinar-webhooks-dlq"

# Handouts (EU jurisdiction bucket: `wrangler r2 bucket create ghq-webinar-files --jurisdiction eu`)
[[r2_buckets]]
binding = "FILES"
bucket_name = "ghq-webinar-files"
jurisdiction = "eu"

# Per-IP rate limits (Workers rate-limiting binding).
[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_REGISTER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["* * * * *"]           # evergreen slots, session finalisation, stale attendance, retention

[observability]
enabled = true
