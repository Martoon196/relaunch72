# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Property Predator Growth HQ — CONTROLLED PRODUCTION PILOT ONLY.
#
# This is intentionally separate from render.yaml, which remains the Relaunch72
# test-payments sandbox. In Render, create a NEW Blueprint and explicitly select
# this file. Never point the existing sandbox Blueprint at this manifest.
#
# The public web service remains unable to send. Only the isolated Mailgun
# worker is configured for the one-address internal-seed pilot; this Blueprint
# does not stage a job, autoDeploy is off, and a human must still review the
# exact commit, sync the secret slots, and trigger the worker deploy manually.
services:
  - type: web
    name: property-predator-growth-hq
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run serve
    # /health remains process liveness. /ready must fail unless the protected
    # PostgreSQL portal and locked production runtime are genuinely ready.
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: off
    domains:
      - hq.propertypredator.com
    # The canonical domain is the only public origin. Render still exposes the
    # generated target in its dashboard so DNS can be configured.
    renderSubdomainPolicy: disabled
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0

      # Product and canonical origins.
      - key: PORTAL_POSTGRES_ENABLED
        value: "true"
      - key: PORTAL_PRODUCT_PROFILE
        value: property_predator_growth
      - key: PORTAL_BASE_URL
        value: https://hq.propertypredator.com
      - key: PUBLIC_BASE_URL
        value: https://propertypredator.com
      - key: ALLOWED_ORIGINS
        value: https://hq.propertypredator.com,https://propertypredator.com,https://www.propertypredator.com
      - key: SESSION_SECRET
        generateValue: true
      # Render's edge overwrites CF-Connecting-IP; that strict single value is
      # source authority and appendable X-Forwarded-For is ignored. Addresses
      # are HMACed with a key independent from the session-signing secret.
      - key: PORTAL_PROXY_MODE
        value: render
      - key: PORTAL_ABUSE_HASH_SECRET
        generateValue: true

      # The legacy control room remains disabled when ADMIN_PASSWORD is empty.
      # Before deploying an existing password, store the same base32 setup key
      # in the founder's authenticator and this secret slot. Incrementing the
      # epoch below revokes every previously issued admin cookie.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: ADMIN_SESSION_EPOCH
        sync: false

      # Shared Property Predator identity bridge. The enable switch is owned by
      # the web-service dashboard so a later Blueprint sync cannot overwrite an
      # explicitly reviewed activation or emergency deactivation.
      - key: PROPERTY_PREDATOR_SSO_ENABLED
        sync: false
      - key: PROPERTY_PREDATOR_SSO_ISSUER
        value: https://propertypredator.com
      - key: PROPERTY_PREDATOR_SSO_AUTHORIZE_URL
        value: https://propertypredator.com/sso.html
      - key: PROPERTY_PREDATOR_SSO_TOKEN_URL
        value: https://propertypredator.com/api/auth/sso/token
      - key: PROPERTY_PREDATOR_SSO_CLIENT_ID
        sync: false
      - key: PROPERTY_PREDATOR_SSO_CLIENT_SECRET
        sync: false
      - key: PROPERTY_PREDATOR_SSO_REDIRECT_URI
        value: https://hq.propertypredator.com/portal/auth/property-predator/callback
      # First-link authority is explicit server configuration. The user UUID
      # must be the pre-existing office@propertypredator.com HQ founder; the
      # allowlist is the verified main-site Google identity, confirmed by hand.
      - key: PROPERTY_PREDATOR_SSO_BOOTSTRAP_USER_ID
        sync: false
      - key: PROPERTY_PREDATOR_SSO_BOOTSTRAP_EMAILS
        sync: false

      # Payments, public capture, demo data, automatic imports and legacy rails
      # remain unavailable. Provider credentials for those systems are absent.
      - key: PLATFORM_SUBSCRIPTIONS_ENABLED
        value: "false"
      - key: PUBLIC_LEAD_CAPTURE_ENABLED
        value: "false"
      - key: BILLING_ENFORCED
        value: "false"
      - key: PORTAL_DEMO_SEED
        value: "false"
      - key: RELAUNCH72_FORCE_MOCK_BUILDS
        value: "true"
      - key: RELAUNCH72_MAX_CONCURRENT_BUILDS
        value: "1"
      - key: PROPERTY_PREDATOR_EXTERNAL_EVENTS_ENABLED
        value: "false"

      # Read-only, exact-origin company-content source used by the protected
      # Source Sync control. The credential can read only approved company
      # resources; it is not a generate/admin/provider token.
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_ORIGIN
        value: https://propertypredator.com
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_CLIENT_ID
        value: relaunch72
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_READ_TOKEN
        sync: false
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_TIMEOUT_MS
        value: "8000"

      # One bounded company-content model call may create an immutable,
      # source-review-required campaign draft. The source service owns the
      # durable per-client quota and idempotency ledger. This web process has
      # no send, schedule or publish adapter.
      - key: PROPERTY_PREDATOR_CAMPAIGN_GENERATION_ENABLED
        value: "true"
      - key: PROPERTY_PREDATOR_CAMPAIGN_GENERATION_PROVIDER_EFFECTS_ENABLED
        value: "true"
      - key: PROPERTY_PREDATOR_CAMPAIGN_GENERATION_EMERGENCY_PAUSED
        value: "false"
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_GENERATE_TOKEN
        sync: false

      # Neon production web identities. Each URL is issued for exactly the
      # named NOINHERIT login role. Owner, migrator and outbound-worker URLs
      # never enter the internet-facing service.
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_WEB_URL
        sync: false
      - key: DATABASE_IDENTITY_COMMAND_URL
        sync: false
      - key: DATABASE_CRM_COMMAND_URL
        sync: false
      - key: DATABASE_ABUSE_COMMAND_URL
        sync: false
      - key: DATABASE_CONTENT_COMMAND_URL
        sync: false
      # Dedicated metadata-only company-asset reader. It cannot approve,
      # quarantine, publish, generate content or perform provider operations.
      - key: DATABASE_CONTENT_ADAPTER_URL
        sync: false
      # Migration 0040 campaign planning uses its own function-only command
      # role. This identity can append TEST planning intent evidence; it cannot
      # call a social provider or use the worker/revalidator functions.
      - key: DATABASE_PUBLIC_SOCIAL_COMMAND_URL
        sync: false
      # 0052 founder command seam for exact owned X profile evidence and
      # approved enqueue only. It has no worker or provider-call capability.
      - key: DATABASE_OWNED_SOCIAL_COMMAND_URL
        sync: false
      # Function-only 0053 founder command seam. It can bind encrypted Meta
      # evidence, register one approved template and enqueue only after exact
      # consent/PECR/operator evidence. It cannot claim or call a provider.
      - key: DATABASE_WHATSAPP_LIVE_COMMAND_URL
        sync: false
      # Function-only 0054 founder command seam. It resolves the exact person,
      # endpoint, campaign step, approvals and current permission evidence in
      # one serializable transaction; it cannot claim or call Mailgun.
      - key: DATABASE_CUSTOMER_EMAIL_COMMAND_URL
        sync: false
      # Dedicated r72_mailgun_webhook_command identity. This is deliberately
      # narrower than the platform's generic webhook role.
      - key: DATABASE_MAILGUN_WEBHOOK_URL
        sync: false
      # Receipt-only 0054 identity. It is invoked only after the canonical
      # Mailgun route has authenticated and journalled the untouched event.
      - key: DATABASE_CUSTOMER_EMAIL_WEBHOOK_URL
        sync: false
      - key: DATABASE_WEB_POOL_MAX
        value: "4"
      - key: DATABASE_IDENTITY_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_CRM_COMMAND_POOL_MAX
        value: "3"
      - key: DATABASE_ABUSE_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_ABUSE_COMMAND_STATEMENT_TIMEOUT_MS
        value: "1000"
      - key: DATABASE_CONTENT_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_CONTENT_ADAPTER_POOL_MAX
        value: "2"
      - key: DATABASE_PUBLIC_SOCIAL_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_OWNED_SOCIAL_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_WHATSAPP_LIVE_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_CUSTOMER_EMAIL_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_MAILGUN_WEBHOOK_POOL_MAX
        value: "2"
      - key: DATABASE_CUSTOMER_EMAIL_WEBHOOK_POOL_MAX
        value: "2"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"

      # Internal seed-pilot boundary. The workspace UUID is server-owned config,
      # not browser input. No customer records are imported by this Blueprint.
      - key: PROPERTY_PREDATOR_PILOT_WORKSPACE_ID
        sync: false
      - key: PROPERTY_PREDATOR_MAILGUN_CONNECTION_ID
        sync: false
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_LIVE_WORKSPACE_ID
        sync: false
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_LIVE_CONNECTION_ID
        sync: false
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false
      - key: PROPERTY_PREDATOR_PILOT_STAGE
        value: internal-seed
      - key: PROPERTY_PREDATOR_PILOT_RECIPIENT_SCOPE
        value: owned-internal-seeds-only
      - key: PROPERTY_PREDATOR_PILOT_MAX_RECIPIENTS
        value: "10"

      # Provider effects are triply fail-closed. A later activation requires a
      # separate user approval plus a reviewed configuration change.
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_SOCIAL_EMERGENCY_PAUSED
        value: "true"
      - key: PROPERTY_PREDATOR_EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_EMAIL_EMERGENCY_PAUSED
        value: "true"
      - key: PROPERTY_PREDATOR_EMAIL_PROVIDER
        value: mailgun

      # Mailgun EU INGRESS slots only. The public web service never receives the
      # outbound API key. Signed provider test events are permitted; they cause
      # no outbound provider effect.
      - key: PROPERTY_PREDATOR_MAILGUN_WEBHOOK_ENABLED
        value: "true"
      # 0054 projection remains independently dark. Enabling it sends nothing;
      # it only adds the receipt-only projector to this already signed route.
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_RECEIPTS_ENABLED
        value: "false"
      # Exposes only the signed owned-office reply endpoint. A separately
      # configured Mailgun Route is still required; this setting sends nothing.
      - key: PROPERTY_PREDATOR_MAILGUN_INBOUND_ENABLED
        value: "true"
      - key: MAILGUN_SIGNING_KEY
        sync: false
      - key: MAILGUN_REGION
        value: eu
      - key: MAILGUN_EVENT_WEBHOOK_URL
        value: https://hq.propertypredator.com/api/provider-webhooks/mailgun/events
      - key: MAILGUN_WEBHOOK_SIGNATURE_VERIFICATION_ENABLED
        value: "true"

  # 0053 one-at-a-time Meta WhatsApp dispatch worker. It deploys dark, proves
  # its exact function boundary and makes no startup provider call. The Meta
  # access token remains inside the job-bound encrypted database envelope.
  - type: worker
    name: property-predator-meta-whatsapp-live-worker
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:meta-whatsapp-live-worker
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_WHATSAPP_LIVE_WORKER_URL
        sync: false
      - key: DATABASE_WHATSAPP_LIVE_WORKER_POOL_MAX
        value: "1"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false
      - key: PROPERTY_PREDATOR_WHATSAPP_LIVE_WORKSPACE_ID
        sync: false
      - key: PROPERTY_PREDATOR_WHATSAPP_LIVE_CONNECTION_ID
        sync: false
      - key: PROPERTY_PREDATOR_WHATSAPP_CREDENTIAL_ENCRYPTION_KEY_BASE64
        sync: false
      - key: PROPERTY_PREDATOR_WHATSAPP_CREDENTIAL_ENCRYPTION_KEY_VERSION
        sync: false
      - key: PROPERTY_PREDATOR_WHATSAPP_LIVE_MODE
        value: disabled
      - key: PROPERTY_PREDATOR_WHATSAPP_LIVE_PROVIDER_ID
        value: meta_whatsapp_cloud
      - key: PROPERTY_PREDATOR_WHATSAPP_LIVE_POLL_MS
        value: "5000"
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_WHATSAPP_EMERGENCY_PAUSED
        value: "true"

  # Public Meta callback surface. This process owns only the webhook login,
  # app-signature secret and verification token. It never receives the outbound
  # access token, envelope key, portal session secret or any other database URL.
  - type: web
    name: property-predator-meta-whatsapp-live-webhook
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:meta-whatsapp-live-webhook
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_WHATSAPP_LIVE_WEBHOOK_URL
        sync: false
      - key: DATABASE_WHATSAPP_LIVE_WEBHOOK_POOL_MAX
        value: "2"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false
      - key: PROPERTY_PREDATOR_WHATSAPP_WEBHOOK_MODE
        value: disabled
      - key: PROPERTY_PREDATOR_WHATSAPP_LIVE_PROVIDER_ID
        value: meta_whatsapp_cloud
      - key: PROPERTY_PREDATOR_WHATSAPP_LIVE_WORKSPACE_ID
        sync: false
      - key: PROPERTY_PREDATOR_WHATSAPP_LIVE_CONNECTION_ID
        sync: false
      - key: PROPERTY_PREDATOR_WHATSAPP_LIVE_BINDING_ID
        sync: false
      - key: PROPERTY_PREDATOR_META_WHATSAPP_APP_ID
        sync: false
      - key: PROPERTY_PREDATOR_META_WHATSAPP_WABA_ID
        sync: false
      - key: PROPERTY_PREDATOR_META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: PROPERTY_PREDATOR_META_WHATSAPP_APP_SECRET
        sync: false
      - key: PROPERTY_PREDATOR_META_WHATSAPP_VERIFY_TOKEN
        sync: false

  # 0054 permission-bound customer-email worker. It deploys dark and proves
  # its exact database boundary without constructing the Mailgun adapter or
  # making a startup provider call. Activation is a separate reviewed change.
  - type: worker
    name: property-predator-customer-email-live
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:customer-email-live
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_CUSTOMER_EMAIL_WORKER_URL
        sync: false
      - key: DATABASE_CUSTOMER_EMAIL_WORKER_POOL_MAX
        value: "1"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_LIVE_WORKSPACE_ID
        sync: false
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_LIVE_CONNECTION_ID
        sync: false
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_LIVE_MODE
        value: disabled
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_PROVIDER_ID
        value: mailgun_eu
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_LIVE_POLL_MS
        value: "5000"
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_EMERGENCY_PAUSED
        value: "true"
      # Operator attestation only: release this after the separate web receipt
      # projector is deployed and its protected readiness is green.
      - key: PROPERTY_PREDATOR_CUSTOMER_EMAIL_RECEIPTS_CONFIRMED
        value: "false"
      # Mailgun EU egress only. The signing key and broad account API key are
      # absent; the secret slot is scoped to this one sending domain.
      - key: MAILGUN_REGION
        value: eu
      - key: MAILGUN_SENDING_DOMAIN
        value: mg.propertypredator.com
      - key: MAILGUN_KEY_SCOPE
        value: domain-sending
      - key: MAILGUN_DOMAIN_SENDING_KEY
        sync: false
      - key: MAILGUN_FROM_EMAIL
        sync: false

  # This isolated worker is the only process that may receive the domain-scoped
  # Mailgun outbound key and verified sender. The Blueprint starts the reviewed
  # worker composition but never stages an email job.
  - type: worker
    name: property-predator-email-worker
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:property-predator-email-worker
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # The worker receives only r72_mailgun_worker_command, never portal,
      # webhook, owner, migrator, import or generic database credentials.
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_MAILGUN_WORKER_URL
        sync: false
      - key: DATABASE_MAILGUN_WORKER_POOL_MAX
        value: "3"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"

      # Exact controlled live mode. Startup fails closed unless every switch,
      # recipient and cap below matches the reviewed one-address seed pilot.
      - key: PROPERTY_PREDATOR_EMAIL_WORKER_MODE
        value: internal-seed-live

      # These switches affect only the isolated email worker. The public web
      # service remains effects-off and paused; social/WhatsApp/DM/webinar rails
      # receive no credential or activation switch.
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "true"
      - key: PROPERTY_PREDATOR_EMAIL_DELIVERY_ENABLED
        value: "true"
      - key: PROPERTY_PREDATOR_EMAIL_EMERGENCY_PAUSED
        value: "false"
      - key: PROPERTY_PREDATOR_EMAIL_PROVIDER
        value: mailgun
      - key: PROPERTY_PREDATOR_PILOT_WORKSPACE_ID
        sync: false
      - key: PROPERTY_PREDATOR_MAILGUN_CONNECTION_ID
        sync: false
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false
      - key: PROPERTY_PREDATOR_PILOT_STAGE
        value: internal-seed
      - key: PROPERTY_PREDATOR_PILOT_RECIPIENT_SCOPE
        value: owned-internal-seeds-only
      - key: PROPERTY_PREDATOR_PILOT_MAX_RECIPIENTS
        value: "1"
      - key: PROPERTY_PREDATOR_EMAIL_INTERNAL_SEEDS
        sync: false
      - key: PROPERTY_PREDATOR_EMAIL_RUN_MESSAGE_CAP
        value: "1"
      - key: PROPERTY_PREDATOR_EMAIL_MONTHLY_MESSAGE_CAP
        value: "3"
      # USD micros: one conservative unit estimate, one unit/run, three/month.
      - key: PROPERTY_PREDATOR_EMAIL_ESTIMATED_RECIPIENT_COST_USD_MICROS
        value: "1000"
      - key: PROPERTY_PREDATOR_EMAIL_RUN_SPEND_CAP_USD_MICROS
        value: "1000"
      - key: PROPERTY_PREDATOR_EMAIL_MONTHLY_SPEND_CAP_USD_MICROS
        value: "3000"

      # Mailgun EU egress only. The outbound worker receives a key scoped to
      # this single sending domain and a separately verified From identity.
      # The broad account API key and webhook signing key remain absent.
      - key: MAILGUN_REGION
        value: eu
      - key: MAILGUN_SENDING_DOMAIN
        value: mg.propertypredator.com
      - key: MAILGUN_KEY_SCOPE
        value: domain-sending
      - key: MAILGUN_DOMAIN_SENDING_KEY
        sync: false
      - key: MAILGUN_FROM_EMAIL
        sync: false

  # Migration 0040 just-in-time revalidation runs in a separate dark worker.
  # It can claim one due TEST intent, read one exact approved company-content
  # version, persist a lease-bound system proof and materialize the simulator job.
  # It has no social-provider SDK, credential or publication capability.
  - type: worker
    name: property-predator-public-social-revalidator
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:public-social-revalidator
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # One NOINHERIT, function-only identity. Its two source-proof functions
      # are fenced to the exact unexpired job lease; it has no table access.
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_PUBLIC_SOCIAL_REVALIDATOR_URL
        sync: false
      - key: DATABASE_PUBLIC_SOCIAL_REVALIDATOR_POOL_MAX
        value: "1"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false

      # Exact read-only Affiliate Stash/company-content bridge identity. The
      # token is copied from the main Property Predator service's READ slot;
      # the generate token, admin token and every user session remain absent.
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_ORIGIN
        value: https://propertypredator.com
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_CLIENT_ID
        value: relaunch72
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_READ_TOKEN
        sync: false
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_TIMEOUT_MS
        value: "8000"
      # Hard TEST boundary. The runner refuses to boot if any value is relaxed
      # or if a live-provider-shaped credential enters this process.
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_REVALIDATOR_ENVIRONMENT
        value: test
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_REVALIDATOR_POLL_MS
        value: "1000"
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_SOCIAL_EMERGENCY_PAUSED
        value: "true"

  # The only consumer of materialized 0039 TEST operations. It runs a local,
  # deterministic simulator and never loads a network client or live account.
  - type: worker
    name: property-predator-public-social-test-rail
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:public-social-test-rail
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # One exact function-only 0039 worker identity; no portal, revalidator,
      # content, owner, migrator, import or provider credential is supplied.
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_PUBLIC_SOCIAL_WORKER_URL
        sync: false
      - key: DATABASE_PUBLIC_SOCIAL_WORKER_POOL_MAX
        value: "1"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false

      # This exact provider id is the in-memory deterministic TEST simulator.
      # Both locks are startup assertions, not advisory labels.
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_RAIL_ENVIRONMENT
        value: test
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_RAIL_PROVIDER_ID
        value: public_social_dark_simulator
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_RAIL_POLL_MS
        value: "1000"
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_SOCIAL_EMERGENCY_PAUSED
        value: "true"

  # 0052 owned-profile live worker. The service can be deployed in dark mode to
  # prove its exact database boundary without loading an adapter or making a
  # provider call. Activation requires changing the three interlocked safety
  # values together after the owned Ayrshare/X profile evidence is reviewed.
  - type: worker
    name: property-predator-owned-public-social-live
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:owned-public-social-live
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # One exact 0052 function-only login. It can claim/load/begin/settle one
      # owned-profile job and has no direct table, web or planner capability.
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_OWNED_SOCIAL_WORKER_URL
        sync: false
      - key: DATABASE_OWNED_SOCIAL_WORKER_POOL_MAX
        value: "1"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false

      # Tenant/account binding and envelope key are secret-manager values. The
      # plaintext Ayrshare profile key remains encrypted in Neon and is exposed
      # only in memory for the single leased operation.
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_LIVE_WORKSPACE_ID
        sync: false
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_LIVE_CONNECTION_ID
        sync: false
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_PROFILE_ENCRYPTION_KEY_BASE64
        sync: false
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_PROFILE_ENCRYPTION_KEY_VERSION
        sync: false
      - key: AYRSHARE_API_KEY
        sync: false
      - key: AYRSHARE_X_OAUTH1_API_KEY
        sync: false
      - key: AYRSHARE_X_OAUTH1_API_SECRET
        sync: false

      # Dark defaults. No live adapter is instantiated and no dispatch loop is
      # started while this exact trio remains in place.
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_LIVE_MODE
        value: disabled
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_LIVE_PROVIDER_ID
        value: ayrshare
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_LIVE_NETWORK
        value: x
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_LIVE_POLL_MS
        value: "5000"
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_SOCIAL_EMERGENCY_PAUSED
        value: "true"
