# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Property Predator Growth HQ — CONTROLLED PRODUCTION PILOT ONLY.
#
# This is intentionally separate from render.yaml, which remains the Relaunch72
# test-payments sandbox. In Render, create a NEW Blueprint and explicitly select
# this file. Never point the existing sandbox Blueprint at this manifest.
#
# The services are unable to send email as checked in: both provider-effect
# gates are false and the emergency pause is true. autoDeploy is also off. A
# human must review the exact commit, sync the Blueprint, and trigger each
# deploy manually.
services:
  - type: web
    name: property-predator-growth-hq
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run serve
    # /health remains process liveness. /ready must fail unless the protected
    # PostgreSQL portal and locked production runtime are genuinely ready.
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: off
    domains:
      - hq.propertypredator.com
    # The canonical domain is the only public origin. Render still exposes the
    # generated target in its dashboard so DNS can be configured.
    renderSubdomainPolicy: disabled
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0

      # Product and canonical origins.
      - key: PORTAL_POSTGRES_ENABLED
        value: "true"
      - key: PORTAL_PRODUCT_PROFILE
        value: property_predator_growth
      - key: PORTAL_BASE_URL
        value: https://hq.propertypredator.com
      - key: PUBLIC_BASE_URL
        value: https://propertypredator.com
      - key: ALLOWED_ORIGINS
        value: https://hq.propertypredator.com,https://propertypredator.com,https://www.propertypredator.com
      - key: SESSION_SECRET
        generateValue: true
      # Render's edge overwrites CF-Connecting-IP; that strict single value is
      # source authority and appendable X-Forwarded-For is ignored. Addresses
      # are HMACed with a key independent from the session-signing secret.
      - key: PORTAL_PROXY_MODE
        value: render
      - key: PORTAL_ABUSE_HASH_SECRET
        generateValue: true

      # The legacy control room remains disabled when ADMIN_PASSWORD is empty.
      # Before deploying an existing password, store the same base32 setup key
      # in the founder's authenticator and this secret slot. Incrementing the
      # epoch below revokes every previously issued admin cookie.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: ADMIN_SESSION_EPOCH
        sync: false

      # Shared Property Predator identity bridge. The enable switch is owned by
      # the web-service dashboard so a later Blueprint sync cannot overwrite an
      # explicitly reviewed activation or emergency deactivation.
      - key: PROPERTY_PREDATOR_SSO_ENABLED
        sync: false
      - key: PROPERTY_PREDATOR_SSO_ISSUER
        value: https://propertypredator.com
      - key: PROPERTY_PREDATOR_SSO_AUTHORIZE_URL
        value: https://propertypredator.com/sso.html
      - key: PROPERTY_PREDATOR_SSO_TOKEN_URL
        value: https://propertypredator.com/api/auth/sso/token
      - key: PROPERTY_PREDATOR_SSO_CLIENT_ID
        sync: false
      - key: PROPERTY_PREDATOR_SSO_CLIENT_SECRET
        sync: false
      - key: PROPERTY_PREDATOR_SSO_REDIRECT_URI
        value: https://hq.propertypredator.com/portal/auth/property-predator/callback
      # First-link authority is explicit server configuration. The user UUID
      # must be the pre-existing office@propertypredator.com HQ founder; the
      # allowlist is the verified main-site Google identity, confirmed by hand.
      - key: PROPERTY_PREDATOR_SSO_BOOTSTRAP_USER_ID
        sync: false
      - key: PROPERTY_PREDATOR_SSO_BOOTSTRAP_EMAILS
        sync: false

      # Payments, public capture, demo data, automatic imports and legacy rails
      # remain unavailable. Provider credentials for those systems are absent.
      - key: PLATFORM_SUBSCRIPTIONS_ENABLED
        value: "false"
      - key: PUBLIC_LEAD_CAPTURE_ENABLED
        value: "false"
      - key: BILLING_ENFORCED
        value: "false"
      - key: PORTAL_DEMO_SEED
        value: "false"
      - key: RELAUNCH72_FORCE_MOCK_BUILDS
        value: "true"
      - key: RELAUNCH72_MAX_CONCURRENT_BUILDS
        value: "1"
      - key: PROPERTY_PREDATOR_EXTERNAL_EVENTS_ENABLED
        value: "false"

      # Neon production web identities. Each URL is issued for exactly the
      # named NOINHERIT login role. Owner, migrator and outbound-worker URLs
      # never enter the internet-facing service.
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_WEB_URL
        sync: false
      - key: DATABASE_IDENTITY_COMMAND_URL
        sync: false
      - key: DATABASE_CRM_COMMAND_URL
        sync: false
      - key: DATABASE_ABUSE_COMMAND_URL
        sync: false
      - key: DATABASE_CONTENT_COMMAND_URL
        sync: false
      # Dedicated metadata-only company-asset reader. It cannot approve,
      # quarantine, publish, generate content or perform provider operations.
      - key: DATABASE_CONTENT_ADAPTER_URL
        sync: false
      # Migration 0040 campaign planning uses its own function-only command
      # role. This identity can append TEST planning intent evidence; it cannot
      # call a social provider or use the worker/revalidator functions.
      - key: DATABASE_PUBLIC_SOCIAL_COMMAND_URL
        sync: false
      # Dedicated r72_mailgun_webhook_command identity. This is deliberately
      # narrower than the platform's generic webhook role.
      - key: DATABASE_MAILGUN_WEBHOOK_URL
        sync: false
      - key: DATABASE_WEB_POOL_MAX
        value: "4"
      - key: DATABASE_IDENTITY_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_CRM_COMMAND_POOL_MAX
        value: "3"
      - key: DATABASE_ABUSE_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_ABUSE_COMMAND_STATEMENT_TIMEOUT_MS
        value: "1000"
      - key: DATABASE_CONTENT_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_CONTENT_ADAPTER_POOL_MAX
        value: "2"
      - key: DATABASE_PUBLIC_SOCIAL_COMMAND_POOL_MAX
        value: "2"
      - key: DATABASE_MAILGUN_WEBHOOK_POOL_MAX
        value: "2"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"

      # Internal seed-pilot boundary. The workspace UUID is server-owned config,
      # not browser input. No customer records are imported by this Blueprint.
      - key: PROPERTY_PREDATOR_PILOT_WORKSPACE_ID
        sync: false
      - key: PROPERTY_PREDATOR_MAILGUN_CONNECTION_ID
        sync: false
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false
      - key: PROPERTY_PREDATOR_PILOT_STAGE
        value: internal-seed
      - key: PROPERTY_PREDATOR_PILOT_RECIPIENT_SCOPE
        value: owned-internal-seeds-only
      - key: PROPERTY_PREDATOR_PILOT_MAX_RECIPIENTS
        value: "10"

      # Provider effects are triply fail-closed. A later activation requires a
      # separate user approval plus a reviewed configuration change.
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_SOCIAL_EMERGENCY_PAUSED
        value: "true"
      - key: PROPERTY_PREDATOR_EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_EMAIL_EMERGENCY_PAUSED
        value: "true"
      - key: PROPERTY_PREDATOR_EMAIL_PROVIDER
        value: mailgun

      # Mailgun EU INGRESS slots only. The public web service never receives the
      # outbound API key. Signed provider test events are permitted; they cause
      # no outbound provider effect.
      - key: PROPERTY_PREDATOR_MAILGUN_WEBHOOK_ENABLED
        value: "true"
      - key: MAILGUN_SIGNING_KEY
        sync: false
      - key: MAILGUN_REGION
        value: eu
      - key: MAILGUN_EVENT_WEBHOOK_URL
        value: https://hq.propertypredator.com/api/provider-webhooks/mailgun/events
      - key: MAILGUN_WEBHOOK_SIGNATURE_VERIFICATION_ENABLED
        value: "true"

  # This isolated worker is the only process that may ever receive the Mailgun
  # outbound key. Its named entrypoint is deliberately deployment-blocking until
  # the reviewed worker composition lands; do not replace it with `npm run serve`.
  - type: worker
    name: property-predator-email-worker
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:property-predator-email-worker
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # The worker receives only r72_mailgun_worker_command, never portal,
      # webhook, owner, migrator, import or generic database credentials.
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_MAILGUN_WORKER_URL
        sync: false
      - key: DATABASE_MAILGUN_WORKER_POOL_MAX
        value: "3"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"

      # Provider effects remain disabled even if every credential is present.
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_EMAIL_EMERGENCY_PAUSED
        value: "true"
      - key: PROPERTY_PREDATOR_EMAIL_PROVIDER
        value: mailgun
      - key: PROPERTY_PREDATOR_PILOT_WORKSPACE_ID
        sync: false
      - key: PROPERTY_PREDATOR_MAILGUN_CONNECTION_ID
        sync: false
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false
      - key: PROPERTY_PREDATOR_PILOT_STAGE
        value: internal-seed
      - key: PROPERTY_PREDATOR_PILOT_RECIPIENT_SCOPE
        value: owned-internal-seeds-only
      - key: PROPERTY_PREDATOR_PILOT_MAX_RECIPIENTS
        value: "10"
      - key: PROPERTY_PREDATOR_EMAIL_INTERNAL_SEEDS
        sync: false
      - key: PROPERTY_PREDATOR_EMAIL_RUN_MESSAGE_CAP
        value: "10"
      - key: PROPERTY_PREDATOR_EMAIL_MONTHLY_MESSAGE_CAP
        value: "100"
      # USD micros: conservative one-cent estimate, $0.10/run, $1/month.
      - key: PROPERTY_PREDATOR_EMAIL_ESTIMATED_RECIPIENT_COST_USD_MICROS
        value: "10000"
      - key: PROPERTY_PREDATOR_EMAIL_RUN_SPEND_CAP_USD_MICROS
        value: "100000"
      - key: PROPERTY_PREDATOR_EMAIL_MONTHLY_SPEND_CAP_USD_MICROS
        value: "1000000"

      # No Mailgun outbound credential or sending identity is present in the
      # dark deployment. Those values are added only after separate activation
      # approval and a reviewed worker change that can actually use them.

  # Migration 0040 just-in-time revalidation runs in a separate dark worker.
  # It can claim one due TEST intent, read one exact approved company-content
  # version, persist a lease-bound system proof and materialize the simulator job.
  # It has no social-provider SDK, credential or publication capability.
  - type: worker
    name: property-predator-public-social-revalidator
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:public-social-revalidator
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # One NOINHERIT, function-only identity. Its two source-proof functions
      # are fenced to the exact unexpired job lease; it has no table access.
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_PUBLIC_SOCIAL_REVALIDATOR_URL
        sync: false
      - key: DATABASE_PUBLIC_SOCIAL_REVALIDATOR_POOL_MAX
        value: "1"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false

      # Exact read-only Affiliate Stash/company-content bridge identity. The
      # token is copied from the main Property Predator service's READ slot;
      # the generate token, admin token and every user session remain absent.
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_ORIGIN
        value: https://propertypredator.com
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_CLIENT_ID
        value: relaunch72
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_READ_TOKEN
        sync: false
      - key: PROPERTY_PREDATOR_COMPANY_CONTENT_TIMEOUT_MS
        value: "8000"
      # Hard TEST boundary. The runner refuses to boot if any value is relaxed
      # or if a live-provider-shaped credential enters this process.
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_REVALIDATOR_ENVIRONMENT
        value: test
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_REVALIDATOR_POLL_MS
        value: "1000"
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_SOCIAL_EMERGENCY_PAUSED
        value: "true"

  # The only consumer of materialized 0039 TEST operations. It runs a local,
  # deterministic simulator and never loads a network client or live account.
  - type: worker
    name: property-predator-public-social-test-rail
    runtime: node
    region: frankfurt
    plan: starter
    branch: codex/relaunch72-platform-foundation
    numInstances: 1
    buildCommand: npm ci --ignore-scripts --include=dev && node scripts/supply-chain.mjs --check && npm run typecheck && npm test
    startCommand: npm run --workspace orchestrator serve:public-social-test-rail
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # One exact function-only 0039 worker identity; no portal, revalidator,
      # content, owner, migrator, import or provider credential is supplied.
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: DATABASE_PUBLIC_SOCIAL_WORKER_URL
        sync: false
      - key: DATABASE_PUBLIC_SOCIAL_WORKER_POOL_MAX
        value: "1"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: PROPERTY_PREDATOR_DATABASE_INSTALLATION_ID
        sync: false

      # This exact provider id is the in-memory deterministic TEST simulator.
      # Both locks are startup assertions, not advisory labels.
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_RAIL_ENVIRONMENT
        value: test
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_RAIL_PROVIDER_ID
        value: public_social_dark_simulator
      - key: PROPERTY_PREDATOR_PUBLIC_SOCIAL_RAIL_POLL_MS
        value: "1000"
      - key: PROPERTY_PREDATOR_PROVIDER_EFFECTS_ENABLED
        value: "false"
      - key: PROPERTY_PREDATOR_SOCIAL_EMERGENCY_PAUSED
        value: "true"
